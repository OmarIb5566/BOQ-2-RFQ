{% extends "base.html" %}
{% block title %}{{ _('Sign in') }} · BOQ → RFQ{% endblock %}
{% block body %}
<div class="auth">
  <div class="card">
    <div class="logo"><img class="brand-logo light" src="{{ url_for('static', filename='brand/rowad-logo.png') }}" alt="Rowad Modern Engineering"><img class="brand-logo dark" src="{{ url_for('static', filename='brand/rowad-logo-dark.png') }}" alt="Rowad Modern Engineering"><span class="product">BOQ → RFQ</span></div>
    {% for cat, m in get_flashed_messages(with_categories=true) %}<div class="banner {{ 'bad' if cat == 'error' else 'ok' }}">{{ _(m) }}</div>{% endfor %}
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label class="field"><span>{{ _('User name') }}</span><input type="text" name="username" required autofocus autocomplete="username"></label>
      <label class="field"><span>{{ _('Password') }}</span><input type="password" name="password" required autocomplete="current-password"></label>
      <label class="check" style="margin-bottom:1rem"><input type="checkbox" name="remember" checked> {{ _('Keep me signed in for {n} days', n=remember_days or 7) }}</label>
      <button class="btn primary lg" style="width:100%">{{ _('Sign in') }}</button>
    </form>
    <p class="muted small center" style="margin-top:1rem">{{ _('No account? Ask your administrator.') }}</p>
  </div>
</div>
{% endblock %}
