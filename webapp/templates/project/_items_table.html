<div class="table-wrap scroll-y" style="max-height:340px; border:1px solid var(--line)">
<table class="t">
  <thead><tr><th>{{ _("Item") }}</th><th>{{ _("Description") }}</th><th>{{ _("Unit") }}</th><th class="right">{{ _("Qty") }}</th></tr></thead>
  <tbody>
  {% for r in rows %}<tr><td class="nowrap">{{ r.no }}</td><td class="desc">{{ r.desc }}</td><td>{{ r.unit }}</td><td class="right nowrap">{{ r.qty }}</td></tr>{% endfor %}
  </tbody>
</table>
</div>
