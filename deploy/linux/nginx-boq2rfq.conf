# /etc/nginx/sites-available/boq2rfq — HTTPS in front of the app (certificate from IT)
server {
    listen 80;
    server_name boq2rfq.company.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name boq2rfq.company.local;

    ssl_certificate     /etc/ssl/certs/boq2rfq.crt;
    ssl_certificate_key /etc/ssl/private/boq2rfq.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 4g;          # = BOQ_MAX_UPLOAD_MB (drawing sets are large)
    proxy_request_buffering off;      # stream big uploads straight to the app
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
